plugins {
    id 'oneapp.android.library'
    // ONE_APP_CUSTOMIZATION APP-14475: data binding processes the @BindingAdapter functions in
    // this module's Kotlin sources through an annotation processor, so kapt has to stay here.
    id 'com.android.legacy-kapt'
    id 'kotlin-parcelize'
}

apply from: "../buildsystem/activity.gradle"

android {
    namespace = 'com.amity.socialcloud.uikit.common'

    buildFeatures {
        dataBinding = true
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // ONE_APP_CUSTOMIZATION APP-14475: built-in Kotlin has no kotlinOptions on the android
    // extension; jvmTarget follows compileOptions.targetCompatibility set just above.

    packaging {
        resources.pickFirsts += "META-INF/*.kotlin_module"
        resources.excludes += 'META-INF/INDEX.LIST'
        resources.excludes += 'META-INF/io.netty.versions.properties'
    }
}

dependencies {
    implementation 'commons-io:commons-io:2.6'
    api 'com.jakewharton.timber:timber:4.7.1'

    implementation 'org.jsoup:jsoup:1.16.1'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    api "com.google.accompanist:accompanist-permissions:0.34.0"

    testImplementation 'junit:junit:4.13.2'
}
