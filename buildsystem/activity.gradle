apply from: "../buildsystem/submodule.gradle"

android {
    buildFeatures {
        dataBinding = true
        viewBinding = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // ONE_APP_CUSTOMIZATION APP-14475: built-in Kotlin has no kotlinOptions on the android
    // extension; jvmTarget follows compileOptions.targetCompatibility set just above.
}


dependencies {

    // Android support libraries
    sharedSupportLibraries dependencies

    // Coroutine dependencies
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-reactive:1.7.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.0"
    implementation "com.google.code.gson:gson:2.9.0"

    implementation 'com.github.EkoCommunications:Matisse:0.5.3-5'

    //exo player
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3Version"

    // Amity Rx LifeCycle
    api "com.github.EkoCommunications:AmityRxLifeCycle:$amityRxLifeCycleVersion"

    // Glide dependencide
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    // ONE_APP_CUSTOMIZATION APP-14475: Glide's annotation processor is dropped. Neither the
    // fork nor the host declares @GlideModule, so it generated nothing, and keeping it would
    // force kapt - unsupported by built-in Kotlin - onto four modules.
    api "$amitySDKDependency:amity-sdk:$amityMessagingSdkVersion"

    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
}
