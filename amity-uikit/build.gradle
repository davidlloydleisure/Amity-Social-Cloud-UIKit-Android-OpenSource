plugins {
    id 'oneapp.android.library'
    id 'kotlin-parcelize'
}

apply from: "../buildsystem/activity.gradle"

android {
    namespace = 'com.amity.socialcloud.uikit'
    buildTypes {
        release {
            consumerProguardFiles 'amity-proguard-rules.pro'
        }
        debug {
            consumerProguardFiles 'amity-proguard-rules.pro'
        }
    }
    packaging {
        resources.pickFirsts += "META-INF/*.kotlin_module"
        resources.excludes += 'META-INF/INDEX.LIST'
        resources.excludes += 'META-INF/io.netty.versions.properties'
    }
}

dependencies {
    api project(path: ':amity:social-compose')
    api project(path: ':amity:chat-compose')

    api "$amitySDKDependency:amity-sdk:$amityMessagingSdkVersion"
    // Previously reached transitively via the v3 :social module's api deps.
    api "$amitySDKDependency:amity-video-publisher:$amityMessagingSdkVersion"
    api "$amitySDKDependency:amity-video-player:$amityMessagingSdkVersion"
}