plugins {
    id 'oneapp.android.library'
    id 'kotlin-parcelize'
}

apply from: "../buildsystem/activity.gradle"

// The short SHA of the checkout this artifact was built from. Guarded: a consumer building from
// a source archive, or any tree without git, has no .git to ask -- that must degrade, not fail.
//
// ONE_APP_CUSTOMIZATION: run through providers.exec instead of String.execute(). The host build
// has the configuration cache on, and a process started directly at configuration time fails
// it ("external process started 'git rev-parse'"). providers.exec makes the output a tracked
// cache input, so a new commit still refreshes the value. The working directory is this module
// rather than the daemon's current directory, so the hash is the fork's, not the host's.
def resolveGitCommitHash() {
    try {
        def result = providers.exec {
            commandLine "git", "rev-parse", "--short=8", "HEAD"
            workingDir = projectDir
            ignoreExitValue = true
        }
        return result.result.get().exitValue == 0 ? result.standardOutput.asText.get().trim() : "unknown"
    } catch (Exception ignored) {
        return "unknown"
    }
}

android {
    namespace = 'com.amity.socialcloud.uikit'

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        buildConfigField "String", "AMITY_UIKIT_VERSION", "\"${amityUIKitVersion}\""
        buildConfigField "String", "AMITY_UIKIT_COMMIT_HASH", "\"${resolveGitCommitHash()}\""
    }

    buildTypes {
        release {
            consumerProguardFiles 'amity-proguard-rules.pro'
        }
        debug {
            consumerProguardFiles 'amity-proguard-rules.pro'
        }
    }
    packaging {
        resources.pickFirsts += "META-INF/*.kotlin_module"
        resources.excludes += 'META-INF/INDEX.LIST'
        resources.excludes += 'META-INF/io.netty.versions.properties'
    }
}

dependencies {
    api project(path: ':amity:social-compose')
    api project(path: ':amity:chat-compose')

    api "$amitySDKDependency:amity-sdk:$amityMessagingSdkVersion"
    // Previously reached transitively via the v3 :social module's api deps.
    api "$amitySDKDependency:amity-video-publisher:$amityMessagingSdkVersion"
    api "$amitySDKDependency:amity-video-player:$amityMessagingSdkVersion"
}